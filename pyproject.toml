[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "icewarp-api"
version = "0.1.1"
description = "Python client and CLI for the IceWarp Maintenance (Admin) API"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "icewarp-api contributors" },
]
keywords = ["icewarp", "api", "client", "mail", "admin", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications :: Email",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "requests>=2.28",
    "typer>=0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "requests-mock>=1.11",
    "build>=1.0",
    "twine>=5.0",
]

[project.urls]
Homepage = "https://github.com/tofuSCHNITZEL/icewarp-api"
Repository = "https://github.com/tofuSCHNITZEL/icewarp-api"
Issues = "https://github.com/tofuSCHNITZEL/icewarp-api/issues"

[project.scripts]
icewarp-api = "icewarp_api.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/icewarp_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
